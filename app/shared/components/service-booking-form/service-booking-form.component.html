<section class="booking-form-shell">
  <article class="step-card">
    <div class="step-title">
      <span class="step-badge">1</span>
      <h2>Step 1 <span>Select Date</span></h2>
    </div>

    <button class="date-trigger" type="button" (click)="isDatePickerOpen = !isDatePickerOpen">
      <div class="left">
        <ion-icon [icon]="icons.calendarOutline"></ion-icon>
        <div class="copy">
          <strong>{{ selectedDateLabel }}</strong>
          <span>Tap to change</span>
        </div>
      </div>
      <ion-icon [icon]="icons.chevronForwardOutline"></ion-icon>
    </button>

    <div class="date-picker-wrap" *ngIf="isDatePickerOpen">
      <input
        class="date-picker"
        type="date"
        [min]="minDateIso"
        [value]="selectedDateIso"
        (change)="onDateSelected($event)"
      />
    </div>
  </article>

  <article class="step-card">
    <div class="step-title">
      <span class="step-badge amber">
        <ion-icon [icon]="icons.timeOutline"></ion-icon>
      </span>
      <div class="step-copy">
        <h2>Step 2 <span>Select Time</span></h2>
        <p>When should we arrive?</p>
      </div>
    </div>

    <div class="time-grid">
      <button
        class="time-slot"
        type="button"
        *ngFor="let slot of timeSlots"
        [class.active]="slot.id === selectedTimeSlotId"
        (click)="selectTimeSlot(slot.id)"
      >
        <strong>{{ slot.label }}</strong>
        <span>{{ slot.timeText }}</span>
        <ion-icon *ngIf="slot.id === selectedTimeSlotId" [icon]="icons.checkmarkOutline"></ion-icon>
      </button>
    </div>
  </article>

  <article class="step-card">
    <div class="step-title">
      <span class="step-badge mint">
        <ion-icon [icon]="icons.homeOutline"></ion-icon>
      </span>
      <h2>Step 3 <span>Confirm Address</span></h2>
    </div>

    <div class="address-card" *ngIf="selectedAddress as address">
      <div class="address-main">
        <ion-icon [icon]="icons.locationOutline"></ion-icon>
        <div class="address-copy">
          <strong>
            {{ address.label }}
            <small *ngIf="address.isDefault">(Default)</small>
          </strong>
          <p>{{ address.fullAddress }}</p>
        </div>
      </div>
      <button class="address-change-btn" type="button" (click)="openAddressChange()">Change</button>
    </div>

    <div class="selection-summary">
      You selected: {{ selectedDateLabel }} • {{ selectedTimeSlot?.label }} • {{ selectedAddress?.label }}
    </div>

    <button class="request-btn" type="button" (click)="submitRequest()">Request Service</button>
    <p class="starting-price">Starting from ₹{{ startingPrice }}</p>
  </article>
</section>
