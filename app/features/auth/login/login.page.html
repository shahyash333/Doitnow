<ion-content class="login-page" fullscreen="true">
  <div class="login-container">
    <section class="login-header">
      <div class="brand-chip" aria-hidden="true">
        <img class="brand-chip__logo" src="assets/icon/DoItNow.png" alt="" />
      </div>
      <h1 class="app-name" aria-label="Do It Now">
        <span class="app-name__word app-name__word--do">Do</span>
        <span class="app-name__word app-name__word--it">It</span>
        <span class="app-name__word app-name__word--now">Now</span>
      </h1>
      <p class="tagline">Your Task Our Priority</p>
    </section>

    <section class="login-card">
      <div class="login-card__main">
        <h2 class="title">Sign in</h2>

        <button class="google-btn" type="button" [disabled]="isLoading" (click)="signInWithGoogle()">
          <ion-icon [icon]="icons.mailOutline" aria-hidden="true"></ion-icon>
          <span>{{ isLoading ? 'Signing in...' : 'Continue with Google' }}</span>
        </button>

        <ion-text color="danger" *ngIf="debug && errorMessage">
          <p>{{ errorMessage }}</p>
        </ion-text>

        <div class="security-text">
          <ion-icon [icon]="icons.lockClosedOutline"></ion-icon>
          <p>Your account safety is our priority. Fast, secure, and trusted login.</p>
        </div>
      </div>

      <div class="login-card__footer">
        <p class="privacy">We prioritize your privacy. No extra account details are shared.</p>

        <p class="terms">
          By continuing, you agree to our <span>Terms of Service</span> and
          <span>Privacy Policy</span>
        </p>
      </div>
    </section>
  </div>
</ion-content>
