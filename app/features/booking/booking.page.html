<ion-header class="booking-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ serviceName }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="booking-content">
  <app-service-booking-form
    [serviceId]="selectedService?.id ?? null"
    [serviceSlug]="selectedService?.slug ?? null"
    [serviceName]="serviceName"
    [startingPrice]="startingPrice"
    [addonGroups]="addonGroups"
    [selectedAddress]="selectedAddress"
    [isSubmitting]="isSubmitting"
    (changeAddress)="openAddressModal('list')"
    (addAddress)="openAddressModal('add')"
    (requestService)="onRequestService($event)"
  ></app-service-booking-form>
</ion-content>
