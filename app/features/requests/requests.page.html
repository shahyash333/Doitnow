<ion-header class="requests-header">
  <ion-toolbar>
    <ion-title>My Requests</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="requests-content">

  <div class="tabs-container">
    <button class="tab-button" [class.active]="activeTab === 'all'" (click)="selectTab('all')">
      All
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab === 'pending'"
      (click)="selectTab('pending')"
    >
      Pending
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab === 'approved'"
      (click)="selectTab('approved')"
    >
      Approved
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab === 'completed'"
      (click)="selectTab('completed')"
    >
      Completed
    </button>
  </div>

  <div class="requests-list" *ngIf="isLoading">
    <article class="request-card skeleton-card" *ngFor="let _ of skeletonCards">
      <div class="request-top">
        <div class="icon-circle">
          <ion-skeleton-text animated class="skeleton-icon"></ion-skeleton-text>
        </div>
        <div class="request-main">
          <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-description"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-status"></ion-skeleton-text>
        </div>
      </div>
      <div class="request-divider"></div>
      <div class="request-actions">
        <ion-skeleton-text animated class="skeleton-button"></ion-skeleton-text>
      </div>
    </article>
  </div>

  <div class="requests-list" *ngIf="!isLoading">
    <div *ngIf="loadError" class="empty-state">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>{{ loadError }}</p>
      <button class="btn primary retry-btn" type="button" (click)="retryLoad()">Retry</button>
    </div>

    <article class="request-card" *ngFor="let request of filteredRequests" [hidden]="!!loadError">
      <div class="request-top">
        <div class="icon-circle" [ngClass]="request.colorClass">
          <ion-icon [icon]="icons[request.icon]"></ion-icon>
        </div>
        <div class="request-main">
          <div class="request-title-row">
            <h2>{{ request.title }}</h2>
            <ion-icon class="chev" [icon]="icons.chevronForwardOutline"></ion-icon>
          </div>
          <p>{{ request.description }}</p>
          <div class="status-pill" [ngClass]="request.status">
            <ion-icon [icon]="icons[request.statusIcon]"></ion-icon>
            <span>{{ request.statusLabel }}</span>
          </div>
        </div>
      </div>

      <div class="request-divider"></div>

      <div class="request-actions" [ngClass]="request.status">
        <button
          class="btn secondary"
          *ngIf="request.status === 'pending'"
          (click)="performAction(request)"
        >
          Cancel Request
        </button>
        <button
          class="btn outline"
          *ngIf="request.status === 'completed'"
          (click)="performAction(request)"
        >
          <ion-icon [icon]="icons.starOutline"></ion-icon>
          Rate Service
        </button>
        <button class="btn primary" (click)="viewDetails(request)">
          View Details
        </button>
      </div>
    </article>

    <div *ngIf="!loadError && filteredRequests.length === 0" class="empty-state">
      <ion-icon name="document-outline"></ion-icon>
      <p>No requests found</p>
    </div>
  </div>
</ion-content>
